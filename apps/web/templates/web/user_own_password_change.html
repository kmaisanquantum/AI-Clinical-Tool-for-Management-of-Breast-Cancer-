{% extends "base.html" %}

{% block title %}Change Password &bull; Breast Cancer CDS{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Change Account Password</h1>
  <p class="page-subtitle">Update password for your account (<strong>{{ request.user.username }}</strong>).</p>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="{{ form.new_password.id_for_label }}">New Password</label>
      {{ form.new_password }}
    </div>
    <div class="form-group">
      <label for="{{ form.confirm_password.id_for_label }}">Confirm New Password</label>
      {{ form.confirm_password }}
    </div>

    <div style="margin-top: 1.5rem;">
      <button type="submit" class="btn-sm btn-primary" style="padding: 0.6rem 1.2rem; font-size: 0.95rem;">Change Password</button>
      <a href="/" class="btn-sm btn-outline" style="color: var(--text-main); border-color: var(--border-color); margin-left: 0.5rem;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
