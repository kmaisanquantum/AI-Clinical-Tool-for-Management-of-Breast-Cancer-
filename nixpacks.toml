providers = ["python"]

[phases.setup]
nixPkgs = ["python312", "postgresql"]

[phases.install]
cmds = [
  "python -m venv /opt/venv && . /opt/venv/bin/activate",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [". /opt/venv/bin/activate && cd backend && python manage.py collectstatic --noinput"]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
